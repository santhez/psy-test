<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050806">
  <title>От жалобы к запросу — Aura Glass Diagnostics</title>

  <!-- Swiss Font Triad: Doto / YantarDot, Sora, Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;600;700;800;900&family=Sora:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'YantarDot';
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url('fonts/YantarDot-Bold.woff2') format('woff2'),
           url('fonts/YantarDot-Bold.ttf') format('truetype');
    }
    @font-face {
      font-family: 'YantarDot';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('fonts/YantarDot-Regular.woff2') format('woff2'),
           url('fonts/YantarDot-Regular.ttf') format('truetype');
    }
  </style>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Animated Geometric Constellation Background -->
  <canvas id="bg-canvas"></canvas>

  <!-- Ambient Spatial Spotlight -->
  <div class="ambient-spotlight" id="ambient-spotlight"></div>

  <div class="app-container">
    <!-- Top Bar (HUD Console Style) -->
    <header class="app-header">
      <div class="dot-badge">
        <span class="status-pip"></span>
        <span>SOLYANSKY • OS</span>
      </div>
      <div class="hud-telemetry" id="stage-counter">SYS.READY</div>
    </header>

    <!-- Segmented Telemetry Progress -->
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <!-- Main Spatial Viewport -->
    <main id="app-main">
      <!-- Injected by app.js -->
    </main>
  </div>

  <!-- Data & Engine -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
